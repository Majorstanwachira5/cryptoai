version: '3.8'

services:
  cryptohub-user:
    build:
      context: ./cryptohub
      dockerfile: Dockerfile
    container_name: cryptohub_user_app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - NEXT_PUBLIC_APP_NAME=CryptoHub Institutional
      - NEXT_PUBLIC_APP_URL=http://localhost:4000
      - NEXT_PUBLIC_ADMIN_URL=http://localhost:3600
      - JWT_SECRET=cryptohub_ai_super_secret_jwt_key_2026
      - SUPABASE_URL=https://lwsybancxxqwrmxneyui.supabase.co
      - SUPABASE_PUBLISHABLE_KEY=sb_publishable_S6vgt2hh2EkC9WeBer8jRw_5gy2Fj_R
      - DATABASE_URL=postgresql://postgres:8nA76JiDn%40bwqXR@db.lwsybancxxqwrmxneyui.supabase.co:5432/postgres
      - PAYLOR_API_KEY=pk_4buTnI1Mm9SRhFaKYYaZHpK16ivVOhYn
      - PAYLOR_WEBHOOK_SECRET=7cac3823878d18d1fef3fdd19370ec67942bf5b3abb17f21be7fc0b2e68db98e
      - PAYLOR_PAYMENT_CHANNEL=PAYL-EFSJUF
      - PAYLOR_TRON_WALLET=TEbs6th1rgsrZNiYqdZEHGoJ3FJFA1zGYd
    depends_on:
      cryptohub-db:
        condition: service_healthy

  cryptohub-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: cryptohub_admin_app
    restart: unless-stopped
    ports:
      - "3600:3600"
    environment:
      - NODE_ENV=production
      - PORT=3600
      - ADMIN_PORT=3600
      - NEXT_PUBLIC_APP_NAME="CryptoHub Admin Authority"
      - NEXT_PUBLIC_APP_URL=http://localhost:3600
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
      - JWT_SECRET=cryptohub_ai_super_secret_jwt_key_2026
    depends_on:
      - cryptohub-user

  cryptohub-db:
    image: postgres:15-alpine
    container_name: cryptohub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 8nA76JiDn@bwqXR
      POSTGRES_DB: postgres
    ports:
      # Port 5433 mapped to host to prevent any collision with 5050
      - "5433:5432"
    volumes:
      - cryptohub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  cryptohub-redis:
    image: redis:7-alpine
    container_name: cryptohub_redis_cache
    restart: unless-stopped
    ports:
      # Port 6381 mapped to host to prevent default 6379 collision
      - "6381:6379"
    volumes:
      - cryptohub_redisdata:/data

volumes:
  cryptohub_pgdata:
  cryptohub_redisdata:

networks:
  default:
    name: cryptohub-isolated-network
